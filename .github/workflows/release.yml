name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches info.plist version
        run: |
          PLIST_VERSION=$(python3 -c "import plistlib; print(plistlib.load(open('info.plist','rb'))['version'])")
          EXPECTED_TAG="v${PLIST_VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match info.plist version ${PLIST_VERSION} (expected ${EXPECTED_TAG}). Bump info.plist before tagging."
            exit 1
          fi

      - name: Build .alfredworkflow bundle
        run: |
          zip -r MassCode-Search.alfredworkflow . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".gitignore" \
            -x "README.md" \
            -x "LICENSE" \
            -x "screenshot-*.png" \
            -x "*.alfredworkflow"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            MassCode-Search.alfredworkflow
