name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .alfredworkflow bundle
        run: |
          zip -r MassCode-Search.alfredworkflow . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".gitignore" \
            -x "README.md" \
            -x "LICENSE" \
            -x "screenshot-*.png" \
            -x "*.alfredworkflow"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            MassCode-Search.alfredworkflow
